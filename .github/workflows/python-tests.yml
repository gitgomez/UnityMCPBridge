name: Python Tests

on:
  push:
    # main is validated through its promotion PR and again through the
    # tag-triggered source-release workflow.
    branches-ignore: [main]
    paths:
      - Server/**
      - tools/**
      - Contracts/**
      - .github/workflows/python-tests.yml
  pull_request:
    branches: [main, optimize/bridge]
    paths:
      - Server/**
      - tools/**
      - Contracts/**
      - .github/workflows/python-tests.yml
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (defaults to the triggering ref)."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: |
          cd Server
          uv sync
          uv pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          cd Server
          uv run pytest tests/ -v --tb=short --cov --cov-report=xml --cov-report=html --cov-report=term

      - name: Verify canonical tool contracts
        run: |
          cd Server
          uv run python ../tools/tool_contracts.py --check

      - name: Run local harness unit tests (hermetic, no Unity)
        run: |
          uv run --project Server python -m pytest tools/tests/ -v --tb=short

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: ./Server/coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pytest-results
          path: |
            Server/.pytest_cache/
            Server/tests/
            Server/coverage.xml
            Server/htmlcov/
